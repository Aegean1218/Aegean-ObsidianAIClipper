name: Temporary Display Probe PR Build
on:
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DiLinkDisplayProbe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DiLinkDisplayProbe-apk
          path: DiLinkDisplayProbe/app/build/outputs/apk/debug/app-debug.apk
