plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.displayprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.displayprobe'
        minSdk 23
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
